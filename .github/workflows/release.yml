name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trust self-signed certificate
        run: |
          if [ -z "$SELF_SIGNED_CERT" ]; then exit 0; fi
          echo "$SELF_SIGNED_CERT" | base64 --decode > "$RUNNER_TEMP/cert.cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.cer"
        env:
          SELF_SIGNED_CERT: ${{ secrets.SELF_SIGNED_CERT }}
      - name: Build and publish
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          if [ -n "$SELF_SIGNED_CERT" ]; then export CSC_NAME="Hello Self-Signed"; fi
          npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_SIGNED_CERT: ${{ secrets.SELF_SIGNED_CERT }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
